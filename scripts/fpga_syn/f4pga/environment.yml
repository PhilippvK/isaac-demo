name: xc7

channels:
  - litex-hub
  - conda-forge
  - defaults

dependencies:
  # Base pins keep the legacy 2022 XC7 toolchain ABI consistent.
  - python=3.7
  - tbb=2020.3
  - zlib=1.2.13
  - litex-hub::prjxray-tools=0.1_3015_gae546d6b=20220708_203356
  - litex-hub::prjxray-db=0.0_257_g0a0adde=20220708_203356
  - litex-hub::vtr-optimized=8.0.0_5699_g25e723a24=20220708_203356
  - litex-hub::yosys=0.29_35_g57c9eb70f=20230524_010725_py37
  - litex-hub::symbiflow-yosys-plugins=1.20230425_38_g38a8a5d=20230524_010725
  - make
  - lxml
  - git
  - pip
