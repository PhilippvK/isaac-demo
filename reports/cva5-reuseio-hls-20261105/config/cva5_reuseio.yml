# CVA5 discovery with register reuse and scalar memory/branch candidates.
flow:
  demo:
    choose:
      check_potential_min_supported: 0.15
      bb_threshold: 0.9
      bb_min_weight: 0.05
      bb_min_supported_weight: 0.02
      bb_max_num: 10
      bb_min_instrs: null
      allow_mem: true
      allow_loads: true
      allow_stores: true
      allow_branches: true
      allow_compressed: true
      allow_custom: false
      allow_fp: false
      allow_system: false
      allow_rvv: false
    coredsl:
      set_name: XIsaac
    riscv:
      xlen: 32
    etiss:
      core_name: XIsaacCore
    docker:
      mlonmcu_image: philippvk/isaac-quickstart-mlonmcu:cva5-latest
      etiss_image: philippvk/isaac-quickstart-etiss:latest
      etiss_perf_image: philippvk/isaac-quickstart-etiss-perf:latest
      seal5_image: philippvk/isaac-quickstart-seal5:latest
      hls_image: philippvk/isaac-quickstart-hls:latest
      enable: true
    service:
      hostname: localhost
      port: 8080
      tags:
        etiss: etiss
        spike: spike
        seal5: llvm
        etiss_perf: etiss_perf
        hls: null
      enable: false
